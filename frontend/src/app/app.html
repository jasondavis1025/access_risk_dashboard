<mat-toolbar>
  <h1>Access Risk Dashboard</h1>
  <span class="spacer"></span>
  <nav aria-label="Account">
    @if (session(); as current) {
      <span class="signed-in" data-testid="signed-in-email">{{ current.email }}</span>
      <button matButton type="button" (click)="logout()">Log out</button>
    } @else {
      <a matButton routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">
        Log in
      </a>
      <a matButton routerLink="/signup" routerLinkActive="active" ariaCurrentWhenActive="page">
        Sign up
      </a>
    }
  </nav>
</mat-toolbar>

<aside class="demo-notice" aria-label="Demo notice">
  <mat-icon aria-hidden="true">science</mat-icon>
  <p>
    <strong>Demo authentication.</strong> Sign-up and login are simulated in your browser. No
    account is created, nothing is stored or sent, and this provides no real security.
  </p>
</aside>

<main>
  <router-outlet />
</main>

<footer>
  API status: <strong data-testid="api-status">{{ apiStatus() }}</strong>
</footer>
